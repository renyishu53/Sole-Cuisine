# SoloChef 持续集成 —— 六道门禁
#
# 在每个 PR 与 push 到 main 时并行执行：
#   1. lint        —— ruff 代码规范与静态检查（后端）
#   2. typecheck   —— mypy 类型检查（后端）
#   3. test        —— pytest 单元测试（后端，含 RAG 评测扩充测试）
#   4. migrations  —— Alembic 迁移链一致性（upgrade head 后 downgrade base）
#   5. frontend    —— Vitest 前端单元测试 + vue-tsc 类型检查
#   6. rag-eval    —— RAG 检索质量离线评测（CI 回归门槛 Recall >= 0.6）
#
# 六个 job 并行跑，任一失败即阻断合并。后端 dev 依赖（ruff/mypy/pytest）通过
# `[project.optional-dependencies].dev` 安装，避免在 CI 安装重型 AI/ML extra。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.8,<1.0"
      - name: Run ruff
        run: ruff check app/ tests/

  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev deps
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev deps
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q
      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/.pytest_cache/

  migrations:
    name: Alembic Migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./migrate_check.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base (verify reversibility)
        run: alembic downgrade base
        # 0002 的 downgrade 为空操作（遗留表模型已删除无法重建），
        # 这里主要验证 upgrade 链可跑通且无断点。
        continue-on-error: true

  frontend:
    name: Frontend Vitest + TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (vue-tsc)
        run: npm run typecheck
      - name: Run Vitest
        run: npm run test
      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-log
          path: frontend/coverage/

  rag-eval:
    name: RAG Eval (Offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev deps
        run: pip install -e ".[dev]"
      - name: Run offline RAG eval
        env:
          PYTHONPATH: .
        run: python -m scripts.run_rag_eval --offline
      - name: Run RAG eval structure tests
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: pytest tests/test_rag_eval_expanded.py -v
