# =============================================================================
# SoloChef 全栈 Docker Compose 编排
#
# 参考: 阿里云 ECS + Docker Compose 部署最佳实践
# (https://blog.csdn.net/2301_80216352/article/details/162310443)
#
# 服务拓扑:
#   frontend (Nginx + Vue SPA)  -> :80     (对外，端口可用 FRONTEND_PORT 覆盖)
#   backend  (FastAPI + Uvicorn) -> :8000  (对外，Nginx 反代 /api/)
#   worker   (Celery)            - 后台任务消费者（知识入库/图谱同步/定时清理）
#   postgres (PostgreSQL 16)      -> :5433  (宿主机映射)
#   redis    (Redis 7)           -> :6379
#
# ── rag profile（内存大户，按需启用）────────────────────────────────
#   neo4j    (Neo4j 5 Community) -> :7474/:7687   ~1G
#   milvus   (Milvus 2.4 向量库) -> :19530/:9091  ~2G
#     └─ etcd + minio (Milvus 依赖)
#
# 两阶段部署（配置不够时先上线后升级）:
#   阶段1 · 2核4G   基础栈: docker compose up -d
#          .env 设 RAG_ENABLED=false（不配模型目录）
#          → 注册登录/周计划/菜谱/AI聊天 可用，知识库检索关闭
#   阶段2 · 升级 4核8G+ 后启用 RAG 全量:
#          .env 设 RAG_ENABLED=true + 配置 BGE_M3_MODEL_DIR/RERANK_MODEL_DIR
#          docker compose --profile rag up -d
#          → 数据卷保留，知识库 RAG 检索（稠密+稀疏+精排）全量生效
#
# 日志: docker compose logs -f backend
#
# AI 模型: BGE_M3_MODEL_DIR / RERANK_MODEL_DIR 指向服务器上的模型目录
#   （如 /opt/solochef/models/bge-m3），容器内挂载为 /models/*。
#   代码不会隐式下载模型；未挂载时检索链路自动降级（不阻断启动）。
# =============================================================================
services:
  # ── Backend FastAPI 后端 ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solochef-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_POSTGRES_URL: postgresql://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-solochef_password}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: solochef_knowledge
      # 由 .env 控制：2核4G 阶段为 false（知识库关闭），升级后改 true
      RAG_ENABLED: ${RAG_ENABLED:-false}
      # 覆盖 .env 中的本地路径：容器内统一从 /models/* 加载
      EMBEDDING_MODEL_PATH: /models/bge-m3
      RERANK_MODEL_PATH: /models/bge-reranker-v2-m3
    ports:
      - "8000:8000"
    volumes:
      # 本地模型挂载（.env 未配置时挂默认空目录，检索降级不阻断）
      - ${BGE_M3_MODEL_DIR:-./_models/bge-m3}:/models/bge-m3
      - ${RERANK_MODEL_DIR:-./_models/bge-reranker-v2-m3}:/models/bge-reranker-v2-m3
    networks:
      - solochef-net
    # 注意不 depends_on neo4j/milvus：二者属 rag profile，显式依赖会隐式
    # 激活 profile；应用对检索底座不可达已有降级容错（不阻断启动）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Celery Worker 后台任务消费者 ─────────────────────────────────────
  # -Q 消费全部队列（knowledge/graph/maintenance/default，与 worker.py
  #    task_routes 对应）；-B 内嵌 beat 使每日 3 点清理任务生效
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solochef-worker
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "-Q",
        "default,knowledge,graph,maintenance",
        "-B",
      ]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_POSTGRES_URL: postgresql://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-solochef_password}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: solochef_knowledge
      RAG_ENABLED: ${RAG_ENABLED:-false}
      EMBEDDING_MODEL_PATH: /models/bge-m3
      RERANK_MODEL_PATH: /models/bge-reranker-v2-m3
    volumes:
      - ${BGE_M3_MODEL_DIR:-./_models/bge-m3}:/models/bge-m3
      - ${RERANK_MODEL_DIR:-./_models/bge-reranker-v2-m3}:/models/bge-reranker-v2-m3
    networks:
      - solochef-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend Nginx + Vue SPA ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 同源反代（默认）；直连后端改成 http://<服务器IP>:8000/api/v1
        VITE_API_BASE_URL: /api/v1
    container_name: solochef-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - solochef-net
    depends_on:
      backend:
        condition: service_started

  # ── PostgreSQL 16 数据库 ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: solochef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solochef}
      POSTGRES_USER: ${POSTGRES_USER:-solochef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solochef_password}
    ports:
      - "5433:5432"
    volumes:
      - solochef_postgres_data:/var/lib/postgresql/data
    networks:
      - solochef-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solochef} -d ${POSTGRES_DB:-solochef}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 7 缓存 / Celery broker ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: solochef-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - solochef-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j 5 Community 图数据库（rag profile）───────────────────────
  # 阶段2 启用: docker compose --profile rag up -d
  neo4j:
    image: neo4j:5-community
    profiles: ["rag"]
    container_name: solochef-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-solochef_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - solochef-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p ${NEO4J_PASSWORD:-solochef_password} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Milvus 向量数据库（依赖 etcd + minio，rag profile）─────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: ["rag"]
    container_name: solochef-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    networks:
      - solochef-net
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["rag"]
    container_name: solochef-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    networks:
      - solochef-net
    command: minio server /minio_data

  milvus-standalone:
    image: milvusdb/milvus:v2.4.4
    profiles: ["rag"]
    container_name: solochef-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - solochef-net
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s

# ── 持久化卷 ─────────────────────────────────────────────────────────
volumes:
  solochef_postgres_data:
  redis_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:

# ── 桥接网络：容器间通过服务名互访 ───────────────────────────────────
networks:
  solochef-net:
    driver: bridge
