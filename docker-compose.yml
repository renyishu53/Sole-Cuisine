services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_POSTGRES_URL: postgresql://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-solochef_password}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: solochef_knowledge
      RAG_ENABLED: "true"
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_started
      milvus-standalone:
        condition: service_started
      neo4j:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_POSTGRES_URL: postgresql://${POSTGRES_USER:-solochef}:${POSTGRES_PASSWORD:-solochef_password}@postgres:5432/${POSTGRES_DB:-solochef}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-solochef_password}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: solochef_knowledge
      RAG_ENABLED: "true"
    depends_on:
      redis:
        condition: service_started
      milvus-standalone:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: solochef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solochef}
      POSTGRES_USER: ${POSTGRES_USER:-solochef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solochef_password}
    ports: ["5433:5432"]
    volumes: [solochef_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solochef} -d ${POSTGRES_DB:-solochef}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-solochef_password}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]

  # ── Milvus 向量数据库 ──────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes: [etcd_data:/etcd]
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes: [minio_data:/minio_data]
    command: minio server /minio_data

  milvus-standalone:
    image: milvusdb/milvus:v2.4.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530", "9091:9091"]
    volumes: [milvus_data:/var/lib/milvus]
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started

volumes:
  solochef_postgres_data:
  redis_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:
