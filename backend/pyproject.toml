[project]
name = "casamind-api"
version = "0.1.0"
description = "SoloChef AI meal & shopping planning API (MySQL backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "aiomysql>=0.2.0,<1.0",
  "alembic>=1.14,<2.0",
  "bcrypt>=4.2,<6.0",
  "pyjwt>=2.10,<3.0",
  "httpx>=0.27,<1.0",
  "loguru>=0.7,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "redis>=5.2,<7.0",
  "celery>=5.4,<6.0",
  "alibabacloud_dypnsapi20170525>=1.0,<3.0",
  "langchain-openai>=1.4.1",
  "Pillow>=10.0,<12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
ai = [
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langgraph>=1.0,<3.0",
  "pymilvus>=2.4,<3.0",
  "sentence-transformers>=3.0,<6.0",
  "neo4j>=5.25,<6.0",
  "pypdf>=5.0,<7.0",
]
bge = [
  # sentence-transformers 已移至 ai 依赖组（向量模型为 RAG 必需）
]
rerank = [
  "FlagEmbedding>=1.2,<2.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# 可选 AI/ML 依赖（ai/bge/rerank extra）在开发环境未必安装，
# 缺失库存根时忽略，避免阻塞核心代码的类型检查。
[[tool.mypy.overrides]]
module = [
  "langchain_core.*",
  "langchain_openai.*",
  "langchain_text_splitters.*",
  "langgraph.*",
  "chromadb.*",
  "pymilvus.*",
  "neo4j.*",
  "pypdf.*",
  "sentence_transformers.*",
  "FlagEmbedding.*",
]
ignore_missing_imports = true
